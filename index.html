
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Absen Pagi</title>
  <?!= include('CSS'); ?>
</head>
<body>

  <main class="container">
    <header class="header">
      <h1>🌅 Absen Pagi</h1>
      <p>Catat kehadiranmu dengan mudah</p>
    </header>

    <section class="card">
      <div class="waktu">
        <strong id="jam">00:00:00</strong>
        <span id="tanggal">Memuat tanggal...</span>
      </div>

      <form id="formAbsen">
        <label for="nama">Nama Lengkap *</label>
        <input type="text" id="nama" required
          placeholder="Masukkan nama lengkap">

        <label for="kelas">Kelas / Bagian *</label>
        <input type="text" id="kelas" required
          placeholder="Contoh: X IPA 1">

        <label for="id">NIS / ID</label>
        <input type="text" id="id"
          placeholder="Nomor identitas">

        <label>Status Kehadiran *</label>
        <div class="status">
          <label>
            <input type="radio" name="status"
              value="Hadir" checked> ✓ Hadir
          </label>
          <label>
            <input type="radio" name="status"
              value="Izin"> Izin
          </label>
          <label>
            <input type="radio" name="status"
              value="Sakit"> Sakit
          </label>
          <label>
            <input type="radio" name="status"
              value="Alpa"> Alpa
          </label>
        </div>

        <label for="keterangan">Keterangan</label>
        <textarea id="keterangan" rows="2"
          placeholder="Keterangan tambahan"></textarea>

        <button type="submit" id="tombol">
          Kirim Absen
        </button>

        <div id="pesan" role="status"></div>
      </form>
    </section>
  </main>

  <?!= include('JS'); ?>
</body>
</html>
